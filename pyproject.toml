[build-system]
requires = [ "setuptools>=77", "setuptools-scm",]
build-backend = "setuptools.build_meta"

[project]
name = "arches-search"
version = "0.1.0a13"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arches<8.3.0,>=8.2.0a8",
    "arches-controlled-lists>=1.3.0a2",
    "arches-modular-reports>=2.0.0",
    "arches-vue-components>=2.0.0",
]
dynamic = []

[tool.setuptools]
packages = [ "arches_search",]

[dependency-groups]
dev = [ "black==26.3.1", "coverage", "django-silk==5.5.0", "livereload", "pre-commit==4.6.1", "sst",]
